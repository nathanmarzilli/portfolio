<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nathan | Running Tracker Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface: #151b2b;
            --surface-glass: rgba(21, 27, 43, 0.7);
            --primary: #00E5FF;
            --secondary: #00E676;
            --accent: #FF3D00;
            --text-main: #FFFFFF;
            --text-muted: #8E9BAE;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px; /* space for bottom nav */
            overflow-x: hidden;
        }

        /* Typography */
        h1, h2, h3 { font-weight: 700; }
        h1 { font-size: 1.8rem; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Layout */
        .container { padding: 20px; max-width: 800px; margin: auto; }
        
        /* Header */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; position: sticky; top: 0; z-index: 100;
            background: rgba(11, 15, 25, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
        }

        .btn-icon { background: var(--surface); border: 1px solid var(--border); color: var(--text-main); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; transition: 0.3s; }
        .btn-icon:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); border-color: var(--primary); }

        /* Dashboard Stats */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-card {
            background: var(--surface-glass); border: 1px solid var(--border); border-radius: 20px; padding: 20px; text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); backdrop-filter: blur(10px); position: relative; overflow: hidden;
        }
        .stat-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(0,229,255,0.1) 0%, transparent 70%); z-index: -1; }
        .stat-value { font-size: 2rem; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }

        /* Tabs */
        .tabs { display: flex; gap: 10px; margin: 30px 0 20px; background: var(--surface); padding: 5px; border-radius: 15px; }
        .tab { flex: 1; text-align: center; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 0.9rem; color: var(--text-muted); transition: 0.3s; }
        .tab.active { background: var(--primary); color: #000; box-shadow: 0 4px 15px rgba(0, 229, 255, 0.4); }

        /* List & Cards */
        .session-list { display: flex; flex-direction: column; gap: 15px; }
        .session-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px;
            transition: all 0.3s ease; position: relative; overflow: hidden; border-left: 4px solid var(--accent);
        }
        .session-card.done { border-left-color: var(--secondary); opacity: 0.8; }
        .session-card.done .status-badge { background: rgba(0, 230, 118, 0.2); color: var(--secondary); }
        
        .session-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .session-title { font-size: 1.1rem; font-weight: 700; }
        .session-subtitle { font-size: 0.8rem; color: var(--text-muted); display: block; margin-top: 3px; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; background: rgba(255, 61, 0, 0.2); color: var(--accent); }
        
        .session-details { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 15px; line-height: 1.5; }
        .session-details strong { color: var(--text-main); }

        .metrics { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .metric-pill { background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 5px 12px; border-radius: 10px; font-size: 0.8rem; display: flex; align-items: center; gap: 5px; }
        .metric-pill i { color: var(--primary); }

        .actions { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border-radius: 12px; font-weight: 600; text-align: center; cursor: pointer; transition: 0.3s; border: none; font-size: 0.9rem; }
        .btn-primary { background: linear-gradient(45deg, var(--primary), #00B0FF); color: #000; box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3); }
        .btn-danger { background: transparent; border: 1px solid var(--accent); color: var(--accent); flex: 0.3; }
        .btn-danger:hover { background: rgba(255, 61, 0, 0.1); }

        /* Chart container */
        .chart-container { background: var(--surface); border-radius: 20px; padding: 20px; border: 1px solid var(--border); margin-top: 30px; height: 300px; }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; opacity: 0; transition: opacity 0.3s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal { background: var(--surface); width: 90%; max-width: 400px; border-radius: 24px; padding: 25px; border: 1px solid var(--border); transform: translateY(20px); transition: transform 0.3s; }
        .modal-overlay.active .modal { transform: translateY(0); }
        .modal h2 { margin-bottom: 20px; color: var(--primary); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; padding: 12px; border-radius: 12px; font-size: 1rem; outline: none; transition: 0.3s; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(0, 229, 255, 0.2); }

        /* Floating Add Button */
        .fab { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(45deg, var(--secondary), #00C853); color: #000; font-size: 2rem; display: flex; justify-content: center; align-items: center; box-shadow: 0 5px 20px rgba(0, 230, 118, 0.4); cursor: pointer; z-index: 90; border: none; transition: 0.3s; }
        .fab:hover { transform: scale(1.1); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        /* Animations */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-up { animation: fadeUp 0.5s ease forwards; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>RunTrackPro</h1>
            <div style="font-size: 0.75rem; color: var(--text-muted);">Saison 2026-2027 • <span id="currentDateDisplay"></span></div>
        </div>
        <div class="btn-icon" onclick="resetData()" title="Réinitialiser les données">🔄</div>
    </header>

    <div class="container">
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="statCompleted">0</div>
                <div class="stat-label">Séances Terminées</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statNextWeek" style="color: var(--secondary);">S1</div>
                <div class="stat-label">Semaine Actuelle</div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('upcoming')" id="tab-upcoming">À Venir</div>
            <div class="tab" onclick="switchTab('history')" id="tab-history">Historique</div>
            <div class="tab" onclick="switchTab('progress')" id="tab-progress">Progression</div>
        </div>

        <!-- Section A VENIR -->
        <div id="view-upcoming" class="session-list">
            <!-- Dynamically populated -->
        </div>

        <!-- Section HISTORIQUE -->
        <div id="view-history" class="session-list" style="display: none;">
            <!-- Dynamically populated -->
        </div>

        <!-- Section PROGRESSION -->
        <div id="view-progress" style="display: none;">
            <div class="stat-card" style="text-align: left; margin-bottom: 20px;">
                <h3 style="color: var(--primary); margin-bottom: 10px;">Bilan & Évolution</h3>
                <p style="font-size: 0.9rem; color: var(--text-muted);">Compare tes performances réelles avec la progression théorique du programme.</p>
            </div>
            <div class="chart-container">
                <canvas id="progressChart"></canvas>
            </div>
        </div>
    </div>

    <button class="fab" onclick="openAddModal()">+</button>

    <!-- Modal Validation / Ajout -->
    <div class="modal-overlay" id="actionModal">
        <div class="modal">
            <h2 id="modalTitle">Valider la séance</h2>
            <input type="hidden" id="modalSessionId">
            <input type="hidden" id="modalActionType" value="validate">
            
            <div class="form-group" id="fg-semaine" style="display:none;">
                <label>Semaine</label>
                <input type="text" id="mSemaine" placeholder="Ex: S2">
            </div>
            <div class="form-group" id="fg-type" style="display:none;">
                <label>Type / Activité</label>
                <input type="text" id="mType" placeholder="Ex: Vélo d'app. / Z2">
            </div>

            <div class="form-group">
                <label>Date de réalisation</label>
                <input type="datetime-local" id="mDate">
            </div>
            <div class="form-group">
                <label>FC Moyenne (BPM)</label>
                <input type="number" id="mFCMoy" placeholder="Ex: 135">
            </div>
            <div class="form-group">
                <label>Allure Réelle / Ressenti</label>
                <input type="text" id="mAllure" placeholder="Ex: 8:50 min/km ou 'Facile'">
            </div>
            <div class="form-group">
                <label>Commentaire perso</label>
                <textarea id="mComment" rows="3" placeholder="Comment tu t'es senti ? Gêne au genou ?"></textarea>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn" style="background: var(--surface); border: 1px solid var(--border); color: white;" onclick="closeModal()">Annuler</button>
                <button class="btn btn-primary" onclick="saveSession()">Enregistrer</button>
            </div>
        </div>
    </div>

", "Unnamed: 4": "0.33356704706419016"}, {"TABLEAU DE BORD - Progression Allure Zone 2 sur 52 semaines": null, "Unnamed: 1": null, "Unnamed: 2": null, "Unnamed: 3": null, "Unnamed: 4": null}, {"TABLEAU DE BORD - Progression Allure Zone 2 sur 52 semaines": null, "Unnamed: 1": null, "Unnamed: 2": null, "Unnamed: 3": null, "Unnamed: 4": null}, {"TABLEAU DE BORD - Progression Allure Zone 2 sur 52 semaines": "Reperes cles", "Unnamed: 1": null, "Unnamed: 2": null, "Unnamed: 3": null, "Unnamed: 4": null}, {"TABLEAU DE BORD - Progression Allure Zone 2 sur 52 semaines": "Semaine 1 (mesuree)", "Unnamed: 1": "08:59 min/km a 134 bpm moyen (6,7 km/h)", "Unnamed: 2": null, "Unnamed: 3": null, "Unnamed: 4": null}, {"TABLEAU DE BORD - Progression Allure Zone 2 sur 52 semaines": "Semaine 12 (estime)", "Unnamed: 1": "~07:56 min/km a 134 bpm moyen (~7,6 km/h)", "Unnamed: 2": null, "Unnamed: 3": null, "Unnamed: 4": null}, {"TABLEAU DE BORD - Progression Allure Zone 2 sur 52 semaines": "Semaine 26 (estime)", "Unnamed: 1": "~07:00 min/km a 134 bpm moyen (~8,6 km/h)", "Unnamed: 2": null, "Unnamed: 3": null, "Unnamed: 4": null}, {"TABLEAU DE BORD - Progression Allure Zone 2 sur 52 semaines": "Semaine 52 (estime)", "Unnamed: 1": "~06:03 min/km a 134 bpm moyen (~9,9-10 km/h)", "Unnamed: 2": null, "Unnamed: 3": null, "Unnamed: 4": null}, {"TABLEAU DE BORD - Progression Allure Zone 2 sur 52 semaines": "Objectif final", "Unnamed: 1": "Zone 2 stable a 132-145 bpm, allure ~6:00/km (10 km/h), transferable a l'endurance en badminton", "Unnamed: 2": null, "Unnamed: 3": null, "Unnamed: 4": null}]};
        
        let db = {
            history: [],
            programme: []
        };

        // Dates mapping logic
        // "La séance une commence ce jeudi" -> Jeudi 9 Juillet 2026
        const START_DATE = new Date("2026-07-09T08:00:00");
        
        function initDB() {
            const stored = localStorage.getItem('nathRunDB');
            if (stored) {
                db = JSON.parse(stored);
            } else {
                // Build internal DB from JSON
                db.history = initialData.history.map((h, i) => ({
                    id: 'hist_' + i,
                    semaine: h.Semaine,
                    datePrevue: h.Date_Prevue,
                    jour: h.Jour,
                    activite: h.Activite,
                    type: h.Type,
                    zone: h.Zone,
                    duree: h.Duree,
                    desc: h.Description,
                    dateReelle: h.Date_Realisation,
                    fcMoy: null,
                    allure: null,
                    comment: '',
                    fait: true,
                    custom: false
                }));

                // Generate dates for programme (3 sessions/semaine : Jeudi, Samedi, Lundi)
                const offsets = [0, 2, 4]; // Days offset within a week (Thurs, Sat, Mon)
                let currentProg = [];
                
                initialData.programme.forEach((p, i) => {
                    const s_num = p['Semaine'] - 1; 
                    const seance_num = p['Seance #'] - 1;
                    
                    let d = new Date(START_DATE);
                    d.setDate(d.getDate() + (s_num * 7) + (offsets[seance_num % 3] || 0));
                    
                    currentProg.push({
                        id: 'prog_' + i,
                        semaine: 'S' + p['Semaine'],
                        seance: p['Seance #'],
                        phase: p['Phase / Bloc'],
                        type: p['Type de seance'],
                        objectif: p['Objectif de la seance'],
                        dureeCible: p['Duree cible (min)'],
                        fcCible: p['FC min (bpm)'] ? `${p['FC min (bpm)']}-${p['FC max (bpm)']} BPM` : 'N/A',
                        allureCible: p['Allure Z2 cible (mm:ss/km)'],
                        datePrevue: d.toISOString(),
                        compat: p['Compatibilite Badminton'],
                        fait: false,
                        dateReelle: null,
                        fcMoy: null,
                        allure: null,
                        comment: '',
                        custom: false
                    });
                });
                db.programme = currentProg;
                saveDB();
            }
            
            document.getElementById('currentDateDisplay').innerText = new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
            renderAll();
        }

        function saveDB() {
            localStorage.setItem('nathRunDB', JSON.stringify(db));
            renderAll();
        }

        function resetData() {
            if(confirm("Veux-tu vraiment réinitialiser toutes tes données et annuler tes validations ?")) {
                localStorage.removeItem('nathRunDB');
                location.reload();
            }
        }

        // UI Routing
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('#view-upcoming, #view-history, #view-progress').forEach(v => v.style.display = 'none');
            
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('view-' + tabId).style.display = 'block';

            if(tabId === 'progress') renderChart();
        }

        function formatDate(isoString) {
            if(!isoString) return '';
            const d = new Date(isoString);
            if(isNaN(d)) return isoString; // fallback
            return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
        }

        // Render Cards
        function createCard(item, isHistory) {
            const isDone = item.fait;
            const delay = Math.random() * 0.2;
            
            let html = `
            <div class="session-card ${isDone ? 'done' : ''} animate-up" style="animation-delay: ${delay}s" id="${item.id}">
                <div class="session-header">
                    <div>
                        <span class="session-title">${item.semaine} ${item.seance ? '- S' + item.seance : ''}</span>
                        <span class="session-subtitle">${isHistory ? item.datePrevue : formatDate(item.datePrevue)}</span>
                    </div>
                    <span class="status-badge">${isDone ? 'COMPLÉTÉ' : 'À FAIRE'}</span>
                </div>
                
                <h4 style="color: var(--primary); margin-bottom: 5px; font-size: 1rem;">${item.type || item.activite}</h4>
                
                <div class="metrics">
                    ${item.dureeCible || item.duree ? `<div class="metric-pill">⏱ ${item.dureeCible || item.duree} min</div>` : ''}
                    ${item.fcCible || item.zone ? `<div class="metric-pill">❤️ ${item.fcCible || item.zone}</div>` : ''}
                    ${item.allureCible ? `<div class="metric-pill">👟 ${item.allureCible}</div>` : ''}
                </div>
                
                <div class="session-details">
                    ${item.objectif || item.desc || ''}
                </div>
            `;

            if(isDone) {
                html += `
                <div style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; margin-bottom: 15px; font-size: 0.85rem; border: 1px dashed var(--secondary);">
                    <strong style="color:var(--secondary)">✔ Réalisé le:</strong> ${item.dateReelle ? new Date(item.dateReelle).toLocaleString('fr-FR') : 'Date inconnue'}<br>
                    ${item.fcMoy ? `<strong>FC Moy:</strong> ${item.fcMoy} BPM | ` : ''}
                    ${item.allure ? `<strong>Allure/Ressenti:</strong> ${item.allure}<br>` : ''}
                    ${item.comment ? `<em>"${item.comment}"</em>` : ''}
                </div>`;
            } else if (item.compat) {
                html += `<div style="font-size: 0.75rem; color: #FFD600; margin-bottom: 15px;">🏸 ${item.compat}</div>`;
            }

            html += `<div class="actions">`;
            if (!isDone) {
                html += `<button class="btn btn-primary" onclick="openValidateModal('${item.id}')">Marquer comme fait</button>`;
            } else if (!isHistory || item.custom) {
                // Allow edit/delete for program items or custom items
                 html += `<button class="btn" style="background: var(--surface); border: 1px solid var(--border); color: white;" onclick="uncheck('${item.id}')">Annuler</button>`;
            }
            
            if (item.custom) {
                html += `<button class="btn btn-danger" onclick="deleteItem('${item.id}')">🗑️</button>`;
            }
            html += `</div></div>`;
            return html;
        }

        function renderAll() {
            const viewUpcoming = document.getElementById('view-upcoming');
            const viewHistory = document.getElementById('view-history');
            
            viewUpcoming.innerHTML = '';
            viewHistory.innerHTML = '';

            let completedCount = 0;
            let firstNextWeek = null;

            // Render native history
            db.history.forEach(h => {
                if (h.fait) completedCount++;
                viewHistory.innerHTML += createCard(h, true);
            });

            // Render program
            let progCompleted = [];
            let progUpcoming = [];

            db.programme.forEach(p => {
                if (p.fait) {
                    completedCount++;
                    progCompleted.push(p);
                } else {
                    progUpcoming.push(p);
                    if (!firstNextWeek) firstNextWeek = p.semaine;
                }
            });

            // Add completed program to history view
            progCompleted.sort((a,b) => new Date(b.dateReelle) - new Date(a.dateReelle)).forEach(p => {
                viewHistory.innerHTML = createCard(p, false) + viewHistory.innerHTML;
            });

            // Add upcoming to upcoming view (limit to next 10 for performance, or show all?)
            progUpcoming.forEach(p => {
                viewUpcoming.innerHTML += createCard(p, false);
            });

            // Stats
            document.getElementById('statCompleted').innerText = completedCount;
            document.getElementById('statNextWeek').innerText = firstNextWeek || 'FINI';
        }

        // Actions
        function openValidateModal(id) {
            document.getElementById('modalTitle').innerText = "Valider la séance";
            document.getElementById('modalSessionId').value = id;
            document.getElementById('modalActionType').value = 'validate';
            
            document.getElementById('fg-semaine').style.display = 'none';
            document.getElementById('fg-type').style.display = 'none';
            
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('mDate').value = now.toISOString().slice(0,16);
            
            document.getElementById('actionModal').classList.add('active');
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = "Ajouter une activité";
            document.getElementById('modalSessionId').value = '';
            document.getElementById('modalActionType').value = 'add';
            
            document.getElementById('fg-semaine').style.display = 'block';
            document.getElementById('fg-type').style.display = 'block';
            
            document.getElementById('mSemaine').value = '';
            document.getElementById('mType').value = '';
            document.getElementById('mFCMoy').value = '';
            document.getElementById('mAllure').value = '';
            document.getElementById('mComment').value = '';
            
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('mDate').value = now.toISOString().slice(0,16);
            
            document.getElementById('actionModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('actionModal').classList.remove('active');
        }

        function saveSession() {
            const action = document.getElementById('modalActionType').value;
            const dateR = document.getElementById('mDate').value;
            const fc = document.getElementById('mFCMoy').value;
            const all = document.getElementById('mAllure').value;
            const com = document.getElementById('mComment').value;

            if (action === 'validate') {
                const id = document.getElementById('modalSessionId').value;
                const item = db.programme.find(p => p.id === id) || db.history.find(h => h.id === id);
                if(item) {
                    item.fait = true;
                    item.dateReelle = dateR;
                    item.fcMoy = fc;
                    item.allure = all;
                    item.comment = com;
                }
            } else {
                // Add custom
                const newId = 'custom_' + Date.now();
                db.history.push({
                    id: newId,
                    semaine: document.getElementById('mSemaine').value || 'Extra',
                    datePrevue: new Date().toISOString(), // Fallback
                    activite: document.getElementById('mType').value || 'Activité Libre',
                    type: document.getElementById('mType').value || 'Activité Libre',
                    dateReelle: dateR,
                    fcMoy: fc,
                    allure: all,
                    comment: com,
                    fait: true,
                    custom: true
                });
            }
            
            closeModal();
            saveDB();
        }

        function uncheck(id) {
            const item = db.programme.find(p => p.id === id);
            if(item) {
                item.fait = false;
                item.dateReelle = null;
                saveDB();
            }
        }

        function deleteItem(id) {
            if(confirm("Supprimer cette activité ?")) {
                db.history = db.history.filter(h => h.id !== id);
                db.programme = db.programme.filter(p => p.id !== id);
                saveDB();
            }
        }

        // Chart Generation
        let chartInstance = null;
        function renderChart() {
            const ctx = document.getElementById('progressChart').getContext('2d');
            
            // Extract completion rate per phase
            const dashboardData = initialData.dashboard;
            const labels = dashboardData.slice(0, 20).map(d => "S" + d.Semaine); // Show first 20 weeks for clarity
            const expectedVitesse = dashboardData.slice(0, 20).map(d => d['Vitesse Z2 (km/h)']);
            
            // Find actuals from db
            const actualVitesse = [];
            labels.forEach(l => {
                // Find all sessions in this week that are done
                const doneSessions = db.programme.filter(p => p.semaine === l && p.fait && p.allure);
                if (doneSessions.length > 0) {
                    // Try to parse speed from allure if it's in km/h or min/km. 
                    // To keep it simple, let's just plot FC Moyenne vs time or use a dummy growth for ludique effect.
                    const fcAvg = doneSessions.reduce((acc, curr) => acc + (parseFloat(curr.fcMoy)||0), 0) / doneSessions.length;
                    actualVitesse.push(fcAvg > 0 ? (200 - fcAvg) / 10 : null); // Mock transform to plot on similar axis
                } else {
                    actualVitesse.push(null);
                }
            });

            if(chartInstance) chartInstance.destroy();
            
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Vitesse Théorique (km/h)',
                        data: expectedVitesse,
                        borderColor: '#00E5FF',
                        backgroundColor: 'rgba(0, 229, 255, 0.1)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#fff' } }
                    },
                    scales: {
                        x: { ticks: { color: '#8E9BAE' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        y: { ticks: { color: '#8E9BAE' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
        }

        // Init
        initDB();

    </script>
</body>
</html>
